openapi: 3.1.0
info:
  title: 同花顺金融数据 API
  version: 0.1.5
  description: |
    hi_think_financial Rust SDK 所支持 REST 接口的 OpenAPI 定义。
    所有接口都需要通过 X-api-key 请求头传入 API Key。
    业务结果由统一响应信封中的 code 和 message 字段表达，HTTP 状态码为 200 时也可能返回业务错误。
servers:
  - url: https://fuyao.aicubes.cn
    description: 生产环境
security:
  - ApiKeyAuth: []
tags:
  - name: 元信息
    description: 标的检索与代码表。
  - name: 基金
    description: 基金资料、重仓股、净值、收益、持有人结构和 ETF 行情。
  - name: A股行情
    description: A 股行情快照与历史日 K 线。
  - name: 市场数据导出
    description: 全市场 Parquet 数据集下载链接。
  - name: 除复权
    description: A 股复权因子事件流。
  - name: 财务数据
    description: 财务报表与财务指标。
  - name: 交易日历
    description: A 股交易日历。
  - name: 指数
    description: 指数目录、成分股与行情。
  - name: 特色数据
    description: 涨停、热榜、异动与龙虎榜数据。
paths:
  /api/meta/tickers/search:
    get:
      tags: [元信息]
      summary: 检索标的
      operationId: get_meta_tickers_search
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Exchange'
        - $ref: '#/components/parameters/AssetType'
        - $ref: '#/components/parameters/SearchLimit'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/meta/tickers/list:
    get:
      tags: [元信息]
      summary: 获取标的代码表
      operationId: get_meta_tickers_list
      parameters:
        - $ref: '#/components/parameters/AssetType'
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'

  /api/fund/profile/detail:
    get:
      tags: [基金]
      summary: 获取基金基本资料
      operationId: get_fund_profile_detail
      parameters:
        - $ref: '#/components/parameters/FundType'
        - $ref: '#/components/parameters/Thscode'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/fund/portfolio/holdings:
    get:
      tags: [基金]
      summary: 获取基金重仓股
      operationId: get_fund_portfolio_holdings
      parameters:
        - $ref: '#/components/parameters/FundType'
        - $ref: '#/components/parameters/Thscode'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/fund/performance/nav:
    get:
      tags: [基金]
      summary: 获取基金净值序列
      operationId: get_fund_performance_nav
      parameters:
        - $ref: '#/components/parameters/FundType'
        - $ref: '#/components/parameters/Thscode'
        - $ref: '#/components/parameters/NavRange'
        - $ref: '#/components/parameters/NavType'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/fund/performance/returns:
    get:
      tags: [基金]
      summary: 获取基金区间收益
      operationId: get_fund_performance_returns
      parameters:
        - $ref: '#/components/parameters/FundType'
        - $ref: '#/components/parameters/Thscode'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/fund/holders/detail:
    get:
      tags: [基金]
      summary: 获取基金持有人结构
      operationId: get_fund_holders_detail
      parameters:
        - $ref: '#/components/parameters/FundType'
        - $ref: '#/components/parameters/Thscode'
        - $ref: '#/components/parameters/MergeScope'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/fund/market/snapshot:
    get:
      tags: [基金]
      summary: 获取 ETF 行情快照
      operationId: get_fund_market_snapshot
      parameters:
        - $ref: '#/components/parameters/Thscode'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/fund/market/historical:
    get:
      tags: [基金]
      summary: 获取 ETF 历史日 K 线
      operationId: get_fund_market_historical
      parameters:
        - $ref: '#/components/parameters/Thscode'
        - $ref: '#/components/parameters/OptionalInterval'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'

  /api/a-share/prices/snapshot:
    get:
      tags: [A股行情]
      summary: 获取 A 股行情快照
      operationId: get_a_share_prices_snapshot
      parameters:
        - $ref: '#/components/parameters/OptionalThscodes'
        - $ref: '#/components/parameters/SnapshotLimit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share/prices/historical:
    get:
      tags: [A股行情]
      summary: 获取 A 股历史日 K 线
      operationId: get_a_share_prices_historical
      parameters:
        - $ref: '#/components/parameters/Thscode'
        - $ref: '#/components/parameters/Interval'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
        - $ref: '#/components/parameters/Adjust'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'

  /api/dump/market-dumps/daily-k/download-url:
    get:
      tags: [市场数据导出]
      summary: 获取全量日 K 数据下载链接
      operationId: get_market_dump_daily_k_download_url
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/dump/market-dumps/daily-k-10d/download-url:
    get:
      tags: [市场数据导出]
      summary: 获取最近十个交易日日 K 数据下载链接
      operationId: get_market_dump_daily_k_10d_download_url
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/dump/market-dumps/adjustment-factors/download-url:
    get:
      tags: [市场数据导出]
      summary: 获取全量复权因子下载链接
      operationId: get_market_dump_adjustment_factors_download_url
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'

  /api/a-share/corporate-actions/adjustment-factors:
    get:
      tags: [除复权]
      summary: 获取复权因子事件流
      operationId: get_a_share_corporate_actions_adjustment_factors
      parameters:
        - $ref: '#/components/parameters/Thscode'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'

  /api/a-share/financials/income-statements:
    get:
      tags: [财务数据]
      summary: 获取利润表
      operationId: get_a_share_financials_income_statements
      parameters:
        - $ref: '#/components/parameters/Thscode'
        - $ref: '#/components/parameters/FinancialPeriod'
        - $ref: '#/components/parameters/FinancialLimit'
        - $ref: '#/components/parameters/OptionalStartTime'
        - $ref: '#/components/parameters/OptionalEndTime'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share/financials/balance-sheets:
    get:
      tags: [财务数据]
      summary: 获取资产负债表
      operationId: get_a_share_financials_balance_sheets
      parameters:
        - $ref: '#/components/parameters/Thscode'
        - $ref: '#/components/parameters/FinancialPeriod'
        - $ref: '#/components/parameters/FinancialLimit'
        - $ref: '#/components/parameters/OptionalStartTime'
        - $ref: '#/components/parameters/OptionalEndTime'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share/financials/cash-flow-statements:
    get:
      tags: [财务数据]
      summary: 获取现金流量表
      operationId: get_a_share_financials_cash_flow_statements
      parameters:
        - $ref: '#/components/parameters/Thscode'
        - $ref: '#/components/parameters/FinancialPeriod'
        - $ref: '#/components/parameters/FinancialLimit'
        - $ref: '#/components/parameters/OptionalStartTime'
        - $ref: '#/components/parameters/OptionalEndTime'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share/financials/indicators:
    get:
      tags: [财务数据]
      summary: 获取财务指标
      operationId: get_a_share_financials_indicators
      parameters:
        - $ref: '#/components/parameters/Thscode'
        - $ref: '#/components/parameters/Report'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'

  /api/a-share/calendar/trading-days:
    get:
      tags: [交易日历]
      summary: 获取 A 股交易日
      operationId: get_a_share_calendar_trading_days
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'

  /api/a-share-index/catalog/ths-index-list:
    get:
      tags: [指数]
      summary: 获取同花顺指数列表
      operationId: get_a_share_index_catalog_ths_index_list
      parameters:
        - $ref: '#/components/parameters/IndexTag'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share-index/constituents/ths-stock-list:
    get:
      tags: [指数]
      summary: 获取指数成分股
      operationId: get_a_share_index_constituents_ths_stock_list
      parameters:
        - $ref: '#/components/parameters/Thscode'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share-index/prices/snapshot:
    get:
      tags: [指数]
      summary: 获取指数行情快照
      operationId: get_a_share_index_prices_snapshot
      parameters:
        - $ref: '#/components/parameters/Thscodes'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share-index/prices/historical:
    get:
      tags: [指数]
      summary: 获取指数历史日 K 线
      operationId: get_a_share_index_prices_historical
      parameters:
        - $ref: '#/components/parameters/Thscode'
        - $ref: '#/components/parameters/Interval'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'

  /api/a-share/special-data/limit-up-pool:
    get:
      tags: [特色数据]
      summary: 获取涨停股票池
      operationId: get_a_share_special_data_limit_up_pool
      parameters:
        - $ref: '#/components/parameters/DateMs'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/LimitUpSortField'
        - $ref: '#/components/parameters/SortDirection'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share/special-data/limit-up-ladder:
    get:
      tags: [特色数据]
      summary: 获取近期连板天梯
      operationId: get_a_share_special_data_limit_up_ladder
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share/special-data/skyrocket-list:
    get:
      tags: [特色数据]
      summary: 获取飙升榜
      operationId: get_a_share_special_data_skyrocket_list
      parameters:
        - $ref: '#/components/parameters/RankingPeriod'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share/special-data/hot-stock-list:
    get:
      tags: [特色数据]
      summary: 获取热股榜
      operationId: get_a_share_special_data_hot_stock_list
      parameters:
        - $ref: '#/components/parameters/RankingPeriod'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share/special-data/hot-stock-list-history:
    get:
      tags: [特色数据]
      summary: 获取历史热股排行
      operationId: get_a_share_special_data_hot_stock_list_history
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share/special-data/hot-stock-rank-trend:
    get:
      tags: [特色数据]
      summary: 获取个股热榜排名走势
      operationId: get_a_share_special_data_hot_stock_rank_trend
      parameters:
        - $ref: '#/components/parameters/Thscode'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share/special-data/anomaly-analysis-list:
    get:
      tags: [特色数据]
      summary: 获取个股异动原因列表
      operationId: get_a_share_special_data_anomaly_analysis_list
      parameters:
        - $ref: '#/components/parameters/TagCodes'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share/special-data/anomaly-analysis-stock:
    get:
      tags: [特色数据]
      summary: 批量获取指定股票的异动原因
      operationId: get_a_share_special_data_anomaly_analysis_stock
      parameters:
        - $ref: '#/components/parameters/Thscodes'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
  /api/a-share/special-data/dragon-tiger-list:
    get:
      tags: [特色数据]
      summary: 获取龙虎榜
      operationId: get_a_share_special_data_dragon_tiger_list
      parameters:
        - $ref: '#/components/parameters/BoardType'
        - $ref: '#/components/parameters/OptionalDate'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-api-key
  responses:
    ApiResponse:
      description: 统一 API 响应信封；请根据 code 判断业务成功或失败。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
  schemas:
    ApiResponse:
      type: object
      required: [code, message, request_id, data]
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功。
        message:
          type: string
        request_id:
          type: string
          description: 请求追踪 ID。
        data:
          description: 接口业务数据；发生错误时可能为 null。
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
  parameters:
    SearchQuery:
      name: q
      in: query
      required: true
      description: 完整 thscode、ticker 或中英文名称片段。
      schema:
        type: string
    Exchange:
      name: exchange
      in: query
      required: false
      schema:
        type: string
        enum: [SH, SZ, BJ]
    AssetType:
      name: asset_type
      in: query
      required: false
      description: 一个或多个以英文逗号分隔的标准资产类型。
      schema:
        type: string
        examples: [a-share, a-share-index, fund-otc, fund-etf, fund-lof, 'fund-etf,fund-lof']
    SearchLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    ListLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1000
    SnapshotLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 100
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Thscode:
      name: thscode
      in: query
      required: true
      description: 包含市场后缀的完整标的代码。
      schema:
        type: string
      example: 600519.SH
    Thscodes:
      name: thscodes
      in: query
      required: true
      description: 以英文逗号分隔的完整标的代码。
      schema:
        type: string
      example: 600519.SH,000001.SZ
    OptionalThscodes:
      name: thscodes
      in: query
      required: false
      description: 以英文逗号分隔的完整标的代码；省略时按全市场分页查询。
      schema:
        type: string
      example: 600519.SH,000001.SZ
    Interval:
      name: interval
      in: query
      required: true
      schema:
        type: string
        enum: [1d]
        default: 1d
    OptionalInterval:
      name: interval
      in: query
      required: false
      schema:
        type: string
        enum: [1d]
        default: 1d
    StartTime:
      name: start
      in: query
      required: true
      description: 查询起始时间，Unix 毫秒时间戳，包含边界。
      schema:
        type: integer
        format: int64
    EndTime:
      name: end
      in: query
      required: true
      description: 查询结束时间，Unix 毫秒时间戳，包含边界。
      schema:
        type: integer
        format: int64
    OptionalStartTime:
      name: start
      in: query
      required: false
      description: 查询起始时间，Unix 毫秒时间戳，必须与 end 同时提供。
      schema:
        type: integer
        format: int64
    OptionalEndTime:
      name: end
      in: query
      required: false
      description: 查询结束时间，Unix 毫秒时间戳，必须与 start 同时提供。
      schema:
        type: integer
        format: int64
    Adjust:
      name: adjust
      in: query
      required: false
      schema:
        type: string
        enum: [none, forward, backward]
        default: forward
    FundType:
      name: fund_type
      in: query
      required: true
      schema:
        type: string
        enum: [otc, exchange, reits]
    NavRange:
      name: range
      in: query
      required: false
      schema:
        type: string
        enum: [week, month, tmonth, hyear, year, twoyear, tyear, fyear]
    NavType:
      name: nav_type
      in: query
      required: false
      schema:
        type: string
        enum: [unit, adj, 'unit,adj']
        default: 'unit,adj'
    MergeScope:
      name: merge_scope
      in: query
      required: false
      schema:
        type: string
        enum: [all, merged, separate]
        default: all
    FromDate:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
    FinancialPeriod:
      name: period
      in: query
      required: true
      schema:
        type: string
        enum: [annual, quarterly]
        default: annual
    FinancialLimit:
      name: limit
      in: query
      required: false
      description: 最近报告期数，与 start 和 end 互斥。
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 4
    Report:
      name: report
      in: query
      required: true
      description: 报告期，格式如 2025-1 至 2025-4。
      schema:
        type: string
        pattern: '^\d{4}-[1-4]$'
    IndexTag:
      name: tag
      in: query
      required: false
      schema:
        type: string
        enum: [cn_concept, region, tszs, industry]
        default: cn_concept
    DateMs:
      name: date_ms
      in: query
      required: false
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    LimitUpSortField:
      name: sort_field
      in: query
      required: false
      schema:
        type: string
        enum: [last_price, continue_day_cnt, seal_money, limit_up_time]
        default: last_price
    SortDirection:
      name: sort_dir
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    RankingPeriod:
      name: period
      in: query
      required: false
      schema:
        type: string
        enum: [day, hour]
        default: day
    Date:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
    OptionalDate:
      name: date
      in: query
      required: false
      schema:
        type: string
        format: date
    StartDate:
      name: start_date
      in: query
      required: true
      schema:
        type: string
        format: date
    EndDate:
      name: end_date
      in: query
      required: true
      schema:
        type: string
        format: date
    TagCodes:
      name: tag_codes
      in: query
      required: false
      description: 以英文逗号分隔的异动标签代码，多个标签按 OR 关系过滤。
      schema:
        type: string
    BoardType:
      name: board_type
      in: query
      required: false
      schema:
        type: string
        enum: [all, org, hot_money]
        default: all
